[package]
name = "bluearchive-aoi"
version = "0.3.8"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Reads item kinds and counts from the Blue Archive item list"
repository = "https://github.com/miyabisun/bluearchive-aoi"

[lib]
name = "aoi"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPUI is published as weekly snapshots of Zed (gpui-pre); any snapshot may change its API, so the
# version is pinned exactly and raised on purpose.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
# Where the app keeps what it read and its settings, and where it writes the YAML.
dirs = "6"
anyhow = "1"
# NFKC, to match a search typed in full-width forms.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1"
futures = "0.3"
# The local date and time in the name and heading of an export.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml = "0.9"
microlp = "0.6"
ureq = "2"
sha2 = "0.10"
# A phone's screen over USB or Wi-Fi: wireless debugging paired by QR code, its
# services found over mDNS, with no adb installed.
libadb = { version = "0.5", default-features = false, features = ["tokio", "tls", "pairing", "host-keys", "nusb"] }
embedded-io-async = "0.6"
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
nusb = "0.1"
openh264 = "0.9"
rml_rtmp = "0.8"
bytes = "1"
# Scaling each frame to the width it is read at (`screen::normalize`) with SIMD: 6.x needs a
# newer Rust than the 1.96 the gate builds with.
fast_image_resize = "5.5"

# Capturing the game's window: Blue Archive runs on Windows only.
[target.'cfg(windows)'.dependencies]
windows-capture = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Pixel arithmetic converts between integer and float coordinates everywhere.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

# Recognition tests decode and scan full screenshots; unoptimized they crawl.
# No incremental history and no debug info for the dependencies: they piled
# up to 109GB in target/debug (2026-10-14); panics keep their line numbers.
[profile.dev]
opt-level = 2
incremental = false
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
ab_glyph = "0.2"
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
