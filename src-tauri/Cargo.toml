[package]
name = "bluearchive-aoi"
version = "0.1.4"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Reads item kinds and counts from the Blue Archive item list"
repository = "https://github.com/miyabisun/bluearchive-aoi"

[lib]
name = "aoi"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows-capture = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# The same version windows-capture uses; the OCR built into Windows reads names.
windows = { version = "0.61.3", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Pixel arithmetic converts between integer and float coordinates everywhere.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Recognition tests decode and scan full screenshots; unoptimized they crawl.
[profile.dev]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
