name: Release

# A release is built from its commit on main ("release: vX.Y.Z", pushed with
# its tag), not from the tag: the Rust cache a tag's run saves serves that tag
# alone, so every release built cold, while main's serves every later release.
on:
  push:
    branches: [main]
  # The SchaleDB workflow's release of new students: its push starts no run.
  workflow_dispatch:

permissions:
  contents: write

# Fetching crates.io's index over HTTP/2 failed the releases of v0.2.20 and
# v0.2.21 ("Error in the HTTP2 framing layer"): one request at a time, retried.
env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10

jobs:
  publish:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: windows-latest
    env:
      ASSET: bluearchive-aoi-x86_64-pc-windows-msvc.exe
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check that the commit releases Cargo.toml's version
        id: tag
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $subject = git log -1 --format=%s
          if ($subject -ne "release: v$version") {
            throw "commit '$subject' does not release Cargo.toml version $version"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build the app
        run: cargo build --release --locked

      - name: Package the exe and its SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-release | Out-Null
          Copy-Item target\release\bluearchive-aoi.exe "dist-release\$env:ASSET"
          $hash = (Get-FileHash "dist-release\$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\dist-release\$env:ASSET.sha256", "$hash  $env:ASSET`n")
          Get-Content "dist-release\$env:ASSET.sha256"

      # The tag is pushed right after the commit; it must point at it.
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tagged = git ls-remote origin "refs/tags/$env:TAG"
          if (-not ($tagged -and $tagged.StartsWith($env:GITHUB_SHA))) {
            throw "tag $env:TAG does not point at $env:GITHUB_SHA"
          }
          gh release create $env:TAG "dist-release\$env:ASSET" "dist-release\$env:ASSET.sha256" --title $env:TAG --generate-notes --verify-tag

  # The universal macOS app joins the release the Windows job published: both
  # architectures in one binary, in an .app signed ad hoc, on a disk image.
  macos:
    needs: publish
    runs-on: macos-latest
    env:
      ASSET: bluearchive-aoi-universal-apple-darwin.dmg
      APP: bluearchive-aoi.app
      # GPUI's macOS part (gpui-pre-macos 0.3.11) calls Option::map_or_default, stable from Rust
      # 1.98 (v0.3.0's dmg failed on 1.96): this job takes 1.98.1 over rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the app for both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Bundle the app and sign it ad hoc
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          mkdir -p "dist/$APP/Contents/MacOS" "dist/$APP/Contents/Resources"
          lipo -create -output "dist/$APP/Contents/MacOS/bluearchive-aoi" \
            target/aarch64-apple-darwin/release/bluearchive-aoi \
            target/x86_64-apple-darwin/release/bluearchive-aoi
          sed "s/__VERSION__/${TAG#v}/g" Info.plist > "dist/$APP/Contents/Info.plist"
          plutil -lint "dist/$APP/Contents/Info.plist"
          iconset="$RUNNER_TEMP/icon.iconset"
          mkdir "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size icons/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            if [ $double -le 512 ]; then
              sips -z $double $double icons/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "dist/$APP/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "dist/$APP"
          codesign --verify --verbose "dist/$APP"
          lipo -info "dist/$APP/Contents/MacOS/bluearchive-aoi"

      - name: Package the disk image and its SHA-256
        run: |
          ln -s /Applications dist/Applications
          mkdir dist-release
          hdiutil create -volname bluearchive-aoi -srcfolder dist -ov -format UDZO "dist-release/$ASSET"
          cd dist-release
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Add them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$TAG" "dist-release/$ASSET" "dist-release/$ASSET.sha256"
