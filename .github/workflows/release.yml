name: Release

# A release is built from its commit on main ("release: vX.Y.Z", pushed with
# its tag), not from the tag: the Rust cache a tag's run saves serves that tag
# alone, so every release built cold, while main's serves every later release.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Fetching crates.io's index over HTTP/2 failed the releases of v0.2.20 and
# v0.2.21 ("Error in the HTTP2 framing layer"): one request at a time, retried.
env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10

jobs:
  publish:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: windows-latest
    env:
      ASSET: bluearchive-aoi-x86_64-pc-windows-msvc.exe
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check that the commit releases package.json's version
        id: tag
        shell: pwsh
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (($env:MESSAGE -split "`n")[0] -ne "release: v$version") {
            throw "commit '$env:MESSAGE' does not release package.json version $version"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build the app
        run: |
          npm ci
          npm run tauri build -- --no-bundle

      - name: Package the exe and its SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-release | Out-Null
          Copy-Item src-tauri\target\release\bluearchive-aoi.exe "dist-release\$env:ASSET"
          $hash = (Get-FileHash "dist-release\$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\dist-release\$env:ASSET.sha256", "$hash  $env:ASSET`n")
          Get-Content "dist-release\$env:ASSET.sha256"

      # The tag is pushed right after the commit; it must point at it.
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tagged = git ls-remote origin "refs/tags/$env:TAG"
          if (-not ($tagged -and $tagged.StartsWith($env:GITHUB_SHA))) {
            throw "tag $env:TAG does not point at $env:GITHUB_SHA"
          }
          gh release create $env:TAG "dist-release\$env:ASSET" "dist-release\$env:ASSET.sha256" --title $env:TAG --generate-notes --verify-tag

  # The universal macOS app joins the release the Windows job published.
  macos:
    needs: publish
    runs-on: macos-latest
    env:
      ASSET: bluearchive-aoi-universal-apple-darwin.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.macos.conf.json bundles the app into a disk image, signed ad hoc.
      - name: Build the app
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin

      - name: Package the disk image and its SHA-256
        run: |
          mkdir dist-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-release/$ASSET"
          cd dist-release
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Add them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$TAG" "dist-release/$ASSET" "dist-release/$ASSET.sha256"
